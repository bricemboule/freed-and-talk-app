[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "free-and-talk-auth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
 "PyMySQL[rsa]>=1.1,<2", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic[email]>=2.8,<3",
 "pydantic-settings>=2.4,<3", "argon2-cffi>=23,<27", "PyJWT>=2.9,<3",
 "python-multipart>=0.0.9", "redis>=5,<8", "Pillow>=11,<13", "pypdf>=6,<7"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
